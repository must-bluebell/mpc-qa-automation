name: MPC QA regression and schedules

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'
      timezone: Asia/Seoul
    - cron: '0 1 * * *'
      timezone: Asia/Seoul
  repository_dispatch:
    types: [webapp-merged]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [regression, api, load, uat, full]
        default: regression
      app_ref:
        description: Application branch or exact commit (empty uses WEBAPP_REF or main)
        type: string
        required: false

permissions:
  contents: read

# One delivery-state writer. Each job gets a fresh, isolated Docker project.
concurrency:
  group: mpc-qa-regression-and-schedules
  cancel-in-progress: false

jobs:
  code-security:
    name: Application code and dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v7
        with:
          path: qa
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Select exact application revision
        id: plan
        run: node scripts/github-qa.mjs plan
        env:
          WEBAPP_REPOSITORY: ${{ vars.WEBAPP_REPOSITORY }}
          WEBAPP_REF: ${{ vars.WEBAPP_REF || 'main' }}
      - name: Verify application repository access
        env:
          GH_TOKEN: ${{ secrets.WEBAPP_READ_TOKEN }}
          APP_REPOSITORY: ${{ steps.plan.outputs.appRepository }}
          APP_REF: ${{ steps.plan.outputs.appRef }}
        run: node scripts/github-qa.mjs verify-access
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.plan.outputs.appRepository }}
          ref: ${{ steps.plan.outputs.appRef }}
          path: WEB MPC
          token: ${{ secrets.WEBAPP_READ_TOKEN }}
          persist-credentials: false
      - name: Install application dependencies
        working-directory: WEB MPC
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Application typecheck
        id: types
        continue-on-error: true
        working-directory: WEB MPC
        run: corepack pnpm exec tsc --noEmit
      - name: Application lint and boundaries
        id: lint
        continue-on-error: true
        working-directory: WEB MPC
        run: corepack pnpm run lint
      - name: Application dependency vulnerability audit
        id: audit
        continue-on-error: true
        working-directory: WEB MPC
        run: corepack pnpm audit --audit-level high
      - name: Publish code and security gate results
        if: always()
        env:
          TYPES_RESULT: ${{ steps.types.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          echo '### Application code and security gates' >> "$GITHUB_STEP_SUMMARY"
          echo "Typecheck: $TYPES_RESULT; lint: $LINT_RESULT; dependency audit: $AUDIT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$TYPES_RESULT" = success && test "$LINT_RESULT" = success && test "$AUDIT_RESULT" = success
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: qa
    env:
      TZ: Asia/Seoul
      WEBAPP_REPOSITORY: ${{ vars.WEBAPP_REPOSITORY }}
      WEBAPP_REF: ${{ vars.WEBAPP_REF || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: qa
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: npm ci
      - name: Select test suite and application revision
        id: plan
        run: node scripts/github-qa.mjs plan
      - name: Verify application repository access
        env:
          GH_TOKEN: ${{ secrets.WEBAPP_READ_TOKEN }}
          APP_REPOSITORY: ${{ steps.plan.outputs.appRepository }}
          APP_REF: ${{ steps.plan.outputs.appRef }}
        run: node scripts/github-qa.mjs verify-access
      - name: Check out application under test
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.plan.outputs.appRepository }}
          ref: ${{ steps.plan.outputs.appRef }}
          path: WEB MPC
          token: ${{ secrets.WEBAPP_READ_TOKEN }}
          persist-credentials: false
      - run: npm run typecheck
      - run: npm run test:reporting
      - run: npm run check:copy -- --webapp '../WEB MPC'
      - name: Install application scenario dependencies
        if: contains(fromJSON('["uat","full"]'), steps.plan.outputs.suite)
        working-directory: WEB MPC
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Restore Slack incident and delivery state
        uses: actions/cache/restore@v6
        with:
          path: qa/runs/slack-bot-state.json
          key: mpc-qa-slack-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mpc-qa-slack-v1-${{ github.ref_name }}-
      - name: Install Chromium
        if: contains(fromJSON('["regression","uat","full"]'), steps.plan.outputs.suite)
        run: npx playwright install --with-deps chromium
      - name: Install application scenario Chromium
        if: contains(fromJSON('["uat","full"]'), steps.plan.outputs.suite)
        working-directory: WEB MPC
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Install k6
        if: contains(fromJSON('["load","full"]'), steps.plan.outputs.suite)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.k6.io/key.gpg | gpg --dearmor > "$RUNNER_TEMP/k6.gpg"
          sudo install -m 644 "$RUNNER_TEMP/k6.gpg" /usr/share/keyrings/k6-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Prepare disposable Docker configuration
        run: node scripts/github-qa.mjs prepare
      - name: Build and start application stack
        id: stack
        run: npm run stack:up
      - name: Run assertions and publish Slack summary
        env:
          QA_SUITE: ${{ steps.plan.outputs.suite }}
          QA_SEED_PHRASE: ${{ secrets.QA_SEED_PHRASE }}
          WALLET_ADDRESS: ${{ vars.QA_WALLET_ADDRESS }}
          WALLET_ADDRESS_INDEX: ${{ vars.QA_WALLET_ADDRESS_INDEX || '0' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          QA_OWNER_SLACK_ID: ${{ vars.QA_OWNER_SLACK_ID }}
          QA_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node pipeline/orchestrator.mjs --suite "$QA_SUITE" --env local-docker --trigger "github-$GITHUB_EVENT_NAME" --run-id "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Add sanitized results to GitHub summary
        if: always()
        shell: bash
        run: |
          report="runs/published/gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA did not produce results. Check the failed setup step; no passing result is inferred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpc-qa-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/runs/published/*.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Slack incident and delivery state
        if: always() && hashFiles('qa/runs/slack-bot-state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: qa/runs/slack-bot-state.json
          key: mpc-qa-slack-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stop disposable stack
        if: always() && (steps.stack.outcome == 'success' || steps.stack.outcome == 'failure')
        run: npm run stack:down
