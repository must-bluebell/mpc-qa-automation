name: MPC PR quality checks and manual runs

on:
  push:
    branches: [main]
  # Recurring QA is owned by the local scheduler.
  repository_dispatch:
    types: [webapp-pr]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [regression, api, load, uat, full]
        default: regression
      app_ref:
        description: Application branch or exact commit (empty uses WEBAPP_REF or main)
        type: string
        required: false

permissions:
  contents: read

# One delivery-state writer. Each job gets a fresh, isolated Docker project.
concurrency:
  group: mpc-qa-regression-and-schedules
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate application revision and mark PR pending
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      appRepository: ${{ steps.plan.outputs.appRepository }}
      appRef: ${{ steps.plan.outputs.appRef }}
      prNumber: ${{ steps.plan.outputs.prNumber }}
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v7
        with:
          path: qa
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate requested application PR or manual revision
        id: plan
        run: node scripts/github-qa.mjs plan
        env:
          WEBAPP_REPOSITORY: ${{ vars.WEBAPP_REPOSITORY }}
          WEBAPP_REF: ${{ vars.WEBAPP_REF || 'main' }}
          WEBAPP_READ_TOKEN: ${{ secrets.WEBAPP_READ_TOKEN }}
      - name: Publish pending status on application PR
        if: steps.plan.outputs.prNumber != ''
        run: node scripts/github-pr.mjs pending
        env:
          WEBAPP_REPOSITORY: ${{ vars.WEBAPP_REPOSITORY }}
          WEBAPP_REPORT_TOKEN: ${{ secrets.WEBAPP_REPORT_TOKEN }}
          QA_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  code-security:
    needs: prepare
    name: Application code and dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v7
        with:
          path: qa
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify application repository access
        env:
          GH_TOKEN: ${{ secrets.WEBAPP_READ_TOKEN }}
          APP_REPOSITORY: ${{ needs.prepare.outputs.appRepository }}
          APP_REF: ${{ needs.prepare.outputs.appRef }}
        run: node scripts/github-qa.mjs verify-access
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.appRepository }}
          ref: ${{ needs.prepare.outputs.appRef }}
          path: WEB MPC
          token: ${{ secrets.WEBAPP_READ_TOKEN }}
          persist-credentials: false
      - name: Install application dependencies
        working-directory: WEB MPC
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Application typecheck
        id: types
        continue-on-error: true
        working-directory: WEB MPC
        run: corepack pnpm exec tsc --noEmit
      - name: Application lint and boundaries
        id: lint
        continue-on-error: true
        working-directory: WEB MPC
        run: corepack pnpm run lint
      - name: Application dependency vulnerability audit
        id: audit
        continue-on-error: true
        working-directory: WEB MPC
        run: corepack pnpm audit --audit-level high
      - name: Publish code and security gate results
        if: always()
        env:
          TYPES_RESULT: ${{ steps.types.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          echo '### Application code and security gates' >> "$GITHUB_STEP_SUMMARY"
          echo "Typecheck: $TYPES_RESULT; lint: $LINT_RESULT; dependency audit: $AUDIT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$TYPES_RESULT" = success && test "$LINT_RESULT" = success && test "$AUDIT_RESULT" = success
  qa:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: qa
    env:
      TZ: Asia/Seoul
      WEBAPP_REPOSITORY: ${{ vars.WEBAPP_REPOSITORY }}
      WEBAPP_REF: ${{ vars.WEBAPP_REF || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: qa
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: npm ci
      - name: Verify application repository access
        env:
          GH_TOKEN: ${{ secrets.WEBAPP_READ_TOKEN }}
          APP_REPOSITORY: ${{ needs.prepare.outputs.appRepository }}
          APP_REF: ${{ needs.prepare.outputs.appRef }}
        run: node scripts/github-qa.mjs verify-access
      - name: Check out application under test
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.appRepository }}
          ref: ${{ needs.prepare.outputs.appRef }}
          path: WEB MPC
          token: ${{ secrets.WEBAPP_READ_TOKEN }}
          persist-credentials: false
      - run: npm run typecheck
      - run: npm run test:reporting
      - run: npm run check:copy -- --webapp '../WEB MPC'
      - name: Install application scenario dependencies
        if: contains(fromJSON('["uat","full"]'), needs.prepare.outputs.suite)
        working-directory: WEB MPC
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        if: contains(fromJSON('["regression","uat","full"]'), needs.prepare.outputs.suite)
        run: npx playwright install --with-deps chromium
      - name: Install application scenario Chromium
        if: contains(fromJSON('["uat","full"]'), needs.prepare.outputs.suite)
        working-directory: WEB MPC
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Install k6
        if: contains(fromJSON('["load","full"]'), needs.prepare.outputs.suite)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.k6.io/key.gpg | gpg --dearmor > "$RUNNER_TEMP/k6.gpg"
          sudo install -m 644 "$RUNNER_TEMP/k6.gpg" /usr/share/keyrings/k6-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Prepare disposable Docker configuration
        run: node scripts/github-qa.mjs prepare
      - name: Build and start application stack
        id: stack
        run: npm run stack:up
      - name: Run assertions without reporting credentials
        id: assertions
        env:
          QA_SUITE: ${{ needs.prepare.outputs.suite }}
          QA_SEED_PHRASE: ${{ secrets.QA_SEED_PHRASE }}
          WALLET_ADDRESS: ${{ vars.QA_WALLET_ADDRESS }}
          WALLET_ADDRESS_INDEX: ${{ vars.QA_WALLET_ADDRESS_INDEX || '0' }}
          QA_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node pipeline/orchestrator.mjs --suite "$QA_SUITE" --env local-docker --trigger "github-$GITHUB_EVENT_NAME" --run-id "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --no-notify --no-ai
      - name: Export allowlisted Slack report data
        if: always()
        run: node scripts/ci-slack-report.mjs export "runs/gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/run.json" "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        continue-on-error: true
      - name: Upload allowlisted Slack report data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpc-qa-slack-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/ci-slack-report.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Add sanitized results to GitHub summary
        if: always()
        shell: bash
        run: |
          report="runs/published/gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA did not produce results. Check the failed setup step; no passing result is inferred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpc-qa-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/runs/published/*.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop disposable stack
        if: always() && (steps.stack.outcome == 'success' || steps.stack.outcome == 'failure')
        run: npm run stack:down

  ai-report:
    name: Analyze QA evidence with Codex
    if: always() && needs.prepare.result == 'success' && github.event.repository.private == true
    needs: [prepare, qa]
    runs-on: ubuntu-24.04
    environment: qa-ai
    timeout-minutes: 15
    steps:
      # Trusted QA source only: application code never runs with the subscription login.
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.163.0
      - name: Select a private login directory outside the checkout
        run: echo "CODEX_HOME=$RUNNER_TEMP/mpc-qa-codex" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mpc-qa-slack-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming-report
      - name: Validate evidence and produce advisory AI report
        id: review
        continue-on-error: true
        env:
          QA_AI_PROVIDER: codex-cli
          QA_CODEX_MODEL: ${{ vars.QA_CODEX_MODEL }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_AUTH_PERSIST_CONFIGURED: ${{ secrets.CODEX_AUTH_WRITE_TOKEN != '' }}
          QA_EXPECTED_SUITE: ${{ needs.prepare.outputs.suite }}
          QA_APP_REF: ${{ needs.prepare.outputs.appRef }}
        run: node scripts/ci-ai-report.mjs incoming-report/ci-slack-report.json "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Persist refreshed subscription login for the next serialized job
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
        shell: bash
        run: |
          if [ -f "$CODEX_HOME/auth.json" ]; then
            gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" --env qa-ai < "$CODEX_HOME/auth.json"
          fi
      - name: Upload validated report with AI analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpc-qa-reviewed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-review-report.json
            ci-review-report.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove runner credentials and private AI intermediates
        if: always()
        run: rm -rf -- "$CODEX_HOME" ci-ai-private

  slack-report:
    name: Publish QA results from a trusted reporting runner
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, qa, ai-report]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      # No application checkout, installation or test code runs on this host.
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mpc-qa-slack-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming-report
      - name: Download report with AI analysis when available
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mpc-qa-reviewed-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviewed-report
      - name: Restore Slack incident and delivery state
        uses: actions/cache/restore@v6
        with:
          path: runs/slack-bot-state.json
          key: mpc-qa-slack-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mpc-qa-slack-v2-${{ github.ref_name }}-
      - name: Validate report data and publish Slack summary
        env:
          QA_EXPECTED_SUITE: ${{ needs.prepare.outputs.suite }}
          QA_APP_REF: ${{ needs.prepare.outputs.appRef }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          QA_OWNER_SLACK_ID: ${{ vars.QA_OWNER_SLACK_ID }}
          QA_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report=incoming-report/ci-slack-report.json
          if [ -f reviewed-report/ci-review-report.json ]; then report=reviewed-report/ci-review-report.json; fi
          node scripts/ci-slack-report.mjs send "$report" "gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Save Slack incident and delivery state
        if: always() && hashFiles('runs/slack-bot-state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: runs/slack-bot-state.json
          key: mpc-qa-slack-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  pr-report:
    name: Publish pre-merge QA result to application PR
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.prNumber != ''
    needs: [prepare, code-security, qa, ai-report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Fresh trusted QA checkout: the reporting token never enters the app/test jobs.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mpc-qa-reviewed-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviewed-report
      - name: Publish status and update PR report comment
        run: node scripts/github-pr.mjs complete
        env:
          WEBAPP_REPOSITORY: ${{ vars.WEBAPP_REPOSITORY }}
          WEBAPP_REPORT_TOKEN: ${{ secrets.WEBAPP_REPORT_TOKEN }}
          QA_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_JOB_RESULTS: '{"qa":"${{ needs.qa.result }}","code-security":"${{ needs.code-security.result }}"}'
          QA_CI_REPORT_FILE: reviewed-report/ci-review-report.json
