services:
  - type: web
    name: mpc-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /healthz
    disk:
      name: qa-runs
      mountPath: /opt/mpc-automation/runs
      sizeGB: 10
    envVars:
      - { key: QA_DASHBOARD_HOST, value: 0.0.0.0 }
      - { key: QA_HOSTED, value: "1" }
      - { key: QA_DEFAULT_ENV, value: production }
      - { key: QA_PREVIEW_BASE_URL, sync: false }
      - { key: QA_SCHEDULE_FILE, value: pipeline/config/schedules.hosted.json }
      # Render is the only scheduler: it runs pipeline/config/schedules.hosted.json (hosted environments only).
      # schedules.json is intentionally empty; pipeline/lib/placement.mjs refuses any Docker-stack schedule here.
      - { key: QA_SCHEDULER_ENABLED, value: "1" }
      - { key: QA_SLACK_AGENT_ENABLED, value: "0" }
      - { key: QA_EXTERNAL_REPOSITORIES, value: "0" }
      - { key: QA_RUNS_DIR, value: runs }
      - { key: QA_DASHBOARD_ACCESS_TOKEN, generateValue: true }
      - { key: BASE_URL, sync: false }
      - { key: QA_CHAIN_ID, sync: false }
      - { key: QA_ENVIRONMENT, sync: false }
      - { key: QA_SEED_PHRASE, sync: false }
      - { key: WALLET_ADDRESS, sync: false }
      - { key: WALLET_ADDRESS_INDEX, sync: false }
      - { key: SLACK_BOT_TOKEN, sync: false }
      - { key: SLACK_CHANNEL_ID, sync: false }
      - { key: SLACK_ALERT_WEBHOOK_URL, sync: false }
      - { key: QA_DASHBOARD_URL, sync: false }
      # Google sign-in for dashboard viewers (read-only). Leave unset to keep the access key as the only login.
      - { key: QA_GOOGLE_CLIENT_ID, sync: false }
      - { key: QA_GOOGLE_CLIENT_SECRET, sync: false }
      - { key: QA_GOOGLE_ALLOWED_DOMAIN, sync: false }
      - { key: QA_GOOGLE_ALLOWED_EMAILS, sync: false }
      - { key: QA_GOOGLE_PERSONAL_EMAILS, sync: false }
      - { key: QA_GOOGLE_ALLOW_ANY_ACCOUNT, sync: false }
      - { key: QA_GOOGLE_ADMIN_EMAILS, sync: false }
      # Jira tickets for confirmed product failures. Tickets are created by hand unless QA_JIRA_AUTO=1.
      - { key: JIRA_BASE_URL, sync: false }
      - { key: JIRA_EMAIL, sync: false }
      - { key: JIRA_API_TOKEN, sync: false }
