# The managed local recovery workspace is populated independently of a fresh CI checkout.
services:
  web:
    environment:
      QA_APP_RUNTIME: ${QA_APP_RUNTIME:-development}
      QA_ISOLATED_RUNTIME: "1"
    volumes:
      - type: volume
        source: qa_workspace
        target: /app
        volume:
          nocopy: true
volumes:
  qa_workspace:
